<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form for user</title>
</head>
<body>
    <form>
        <label for="username">Username: 
            <input type="text" placeholder="You name" id="username" name="username">
        </label>
        <br><br>
        <label for="age">
            Age: 
            <input type="number" name="age" id="age" placeholder="You age" min="0" max="99">
        </label>
        <br><br>
        <label for="email">
            Email:
            <input type="email" id="email" name="email" placeholder="You email">
        </label>
        <br><br>
        <label for="number">
            Number:
            <input type="tel" name="number" placeholder="+380" id="number">
        </label>
        <br><br>
        <label for="userbirth">
            Enter your date of birth:
            <input type="date" id="userbirth" name="birthday" placeholder="You birthday">
        </label>
        <br><br>
        <button type="submit">
            Submit
        </button>
    </form>
</body>
</html>
