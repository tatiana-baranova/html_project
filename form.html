<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form for user</title>
</head>
<body>
    <form>
        <label for="username">Username: 
            <input type="text" placeholder="You name" id="username" name="username">
        </label>
        <br><br>
        <label for="age">
            Age: 
            <input type="number" name="age" id="age" placeholder="You age" min="0" max="99">
        </label>
        <br><br>
        <label for="email">
            Email:
            <input type="email" id="email" name="email" placeholder="You email">
        </label>
        <br><br>
        <label for="number">
            Number:
            <input type="tel" name="number" placeholder="+380" id="number">
        </label>
        <br><br>
        <label for="userbirth">
            Enter your date of birth:
            <input type="date" id="userbirth" name="birthday">
        </label>
        <br><br>
        You are 18 years old? <input type="checkbox" id="agecheck" checked>
        <br><br>
        Man <input type="radio" name="gender">
        Woman <input type="radio" name="gender">
        <br><br>
        <textarea name="message" id="usermessage" placeholder="Enter you message">Some text</textarea>
        <br><br>
        <select name="userCountry">
            <option value="ukraine">Ukraine</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
        </select>
        <br><br>
        <button type="submit">
            Submit
        </button>
        <button type="reset">Reset</button>
        <!-- <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset"> -->
    </form>
</body>
</html>
