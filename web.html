<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <embed src="https://itproger.com/ua" width="100%" height="500px"> -->
    <input list="cars">
    <datalist id="cars">
        <option value="Audi">
        <option value="BMW">
        <option value="Mercedes">
        <option value="Toyota">
    </datalist>
    <br><br>
    <details>
        <summary>Car Options</summary>
        <p>Choose from the list of available cars.</p>
    </details>
    <br><br>
    <audio controls>
        <source src="https://soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Цей тег не підтримується вашим браузером. Скачайте аудіофайл, щоб прослухати його.
    </audio>

    <br><br>

    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/IyHTJTLqkCA"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

    <br><br>
    <progress value="90" max="100"></progress>
    <meter value="96" max="100" low="10" high="90"></meter>

    <blockquote>
        <h2><strong>Наші переваги:</strong></h2>
        <ul>
            <li>Супер <a href=""><em>ціни</em></a>;</li>
            <li>Великий вибір;</li>
            <li>Кваліфіковані спеціалісти;</li>
        </ul>
    </blockquote>
</body>
</html>
